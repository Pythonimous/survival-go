# Full nginx config for frontend container (static + API proxy + abuse limits).
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # Conservative per-IP limits (aligned with backend defaults).
    limit_req_zone $limit_client_ip zone=api_create:10m rate=3r/m;
    limit_req_zone $limit_client_ip zone=api_write:10m rate=120r/m;
    limit_req_status 429;

    map $http_x_forwarded_for $limit_client_ip {
        default $binary_remote_addr;
        "~^(?<first>[^,]+)" $first;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location = /api/games {
            client_max_body_size 64k;
            limit_req zone=api_create burst=2 nodelay;
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location ~ ^/api/games/[^/]+/(move|resign|analyze|engine-move)$ {
            client_max_body_size 8m;
            limit_req zone=api_write burst=40 nodelay;
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location /api/ {
            client_max_body_size 8m;
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location = /health {
            proxy_pass http://backend:8000/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /wasm/ {
            types {
                application/javascript mjs;
                application/wasm wasm;
            }
            add_header Cache-Control "public, max-age=3600";
            add_header Cross-Origin-Opener-Policy same-origin;
            add_header Cross-Origin-Embedder-Policy require-corp;
            add_header Cross-Origin-Resource-Policy same-origin;
            try_files $uri =404;
        }

        location = /coi-serviceworker.js {
            add_header Cache-Control "public, max-age=3600";
            try_files $uri =404;
        }

        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate";
            add_header Cross-Origin-Opener-Policy same-origin;
            add_header Cross-Origin-Embedder-Policy require-corp;
        }

        location / {
            add_header Cross-Origin-Opener-Policy same-origin;
            add_header Cross-Origin-Embedder-Policy require-corp;
            try_files $uri $uri/ /index.html;
        }
    }
}
