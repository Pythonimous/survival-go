<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!--
      Cross-Origin Isolation bootstrap.
      Mirrors kaya-go/kaya's `apps/web/index.html`: ONNX Runtime Web's
      threaded WASM backend requires `self.crossOriginIsolated === true`
      (which gates `SharedArrayBuffer`). Our dev server and nginx already
      send COOP/COEP, but `coi-serviceworker` installs a same-origin
      service worker that re-injects those headers as a safety net for
      CDNs / preview hosts / embedders that strip them. Must load before
      any module that imports `onnxruntime-web`.
    -->
    <script src="/coi-serviceworker.js"></script>
    <title>Survival Go</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
