# Optional local packaging: backend API + nginx frontend (browser ONNX inference).
# See docs/development/docker-compose.md
services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_APP_BUILD_ID: ${VITE_APP_BUILD_ID:-dev}
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
