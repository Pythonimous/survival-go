# Minimal KataGo analysis config for local CPU / smoke tests.
# See: https://github.com/lightvector/KataGo/blob/master/cpp/configs/analysis_example.cfg

logDir = analysis_logs
reportAnalysisWinratesAs = BLACK

# Low thread counts for CPU-only WSL smoke runs (single query at a time).
numAnalysisThreads = 1
numSearchThreadsPerAnalysisThread = 2

nnCacheSizePowerOfTwo = 20
nnMaxBatchSize = 8
