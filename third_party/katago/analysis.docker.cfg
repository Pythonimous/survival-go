# KataGo analysis config for Docker / light multi-user deploy.
# Point KATAGO_CONFIG_PATH here when running the backend in a container.
#
# Survival Go uses one shared KataGo subprocess; API requests are serialized on
# stdin/stdout. Keep numAnalysisThreads = 1 — raising it does not parallelize
# our client and only increases RAM/CPU contention inside the container.
#
# Under concurrent HTTP load, requests queue behind that lock. Increase
# KATAGO_ANALYSIS_TIMEOUT_SECONDS in the backend env (e.g. 45–60) so queued
# analyze/engine-move calls do not time out before they reach KataGo.
#
# See docs/development/katago-docker.md for sizing notes.

logDir = analysis_logs
reportAnalysisWinratesAs = BLACK

# One position at a time (matches serialized KataGoClient); more search threads
# per position for lower latency when a few users are waiting in queue.
numAnalysisThreads = 1
numSearchThreadsPerAnalysisThread = 4

# Smaller cache/batch than local dev cfg to limit container RAM.
nnCacheSizePowerOfTwo = 18
nnMaxBatchSize = 4
